<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PrimeNest Realty | Find Your Dream Home</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-container">

      <a href="#" class="logo">
        Prime<span>Nest</span>
      </a>

      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Properties</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </nav>

      <a href="#" class="header-btn">
        List Your Property
      </a>

    </div>
  </header>


  <!-- HERO SECTION -->
  <section class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-container">

      <div class="hero-content">

        <p class="hero-label">FIND YOUR DREAM HOME</p>

        <h1>Find a Place You’ll Love to Call Home.</h1>

        <p class="hero-text">
          Discover beautiful homes and premium properties in locations
          you’ll be proud to call home.
        </p>

        <div class="hero-buttons">

          <a href="#properties" class="hero-btn primary-btn">
            Explore Properties
          </a>

          <a href="#contact" class="hero-btn secondary-btn">
            Contact Us
          </a>

        </div>

      </div>

    </div>

  </section>
<!-- PROPERTY SEARCH -->
<section class="property-search">

  <div class="search-container">

    <div class="search-heading">
      <p>SEARCH PROPERTIES</p>
      <h2>Find Your Perfect Property</h2>
    </div>

    <form class="search-box">

      <div class="search-field">
        <label>Location</label>
        <select>
          <option>Choose Location</option>
          <option>New York</option>
          <option>Los Angeles</option>
          <option>Miami</option>
          <option>Chicago</option>
        </select>
      </div>

      <div class="search-field">
        <label>Property Type</label>
        <select>
          <option>Any Property Type</option>
          <option>House</option>
          <option>Apartment</option>
          <option>Villa</option>
          <option>Condo</option>
        </select>
      </div>

      <div class="search-field">
        <label>Price Range</label>
        <select>
          <option>Any Price</option>
          <option>Under $500,000</option>
          <option>$500,000 – $1M</option>
          <option>$1M – $2M</option>
          <option>$2M+</option>
        </select>
      </div>

      <button type="submit" class="search-btn">
        Search Properties
      </button>

    </form>

  </div>

</section>
</body>
</html>
